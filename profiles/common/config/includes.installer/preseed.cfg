# Sovereign Stack OS installer defaults
# Ensure the first regular user created by Debian Installer can administer the system.
d-i preseed/late_command string in-target /bin/sh -c 'user="$(awk -F: '\''$3 >= 1000 && $3 < 60000 {print $1; exit}'\'' /etc/passwd)"; [ -z "$user" ] || usermod -aG sudo "$user"'
